name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: "${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}"
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Run evaluation harness
        run: |
          python scripts/eval_harness.py > eval_results.json
          echo "Evaluation results:"
          python -c "import json; r=json.load(open('eval_results.json')); print(f\"Passed: {r['metadata']['passed']}/{r['metadata']['total_tests']} (pass_rate: {r['metadata']['pass_rate']:.0%})\")"
          # Fail the job if any eval test failed
          python -c "import json, sys; r=json.load(open('eval_results.json')); sys.exit(0 if r['metadata']['failed'] == 0 else 1)"

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-py${{ matrix.python-version }}
          path: eval_results.json
